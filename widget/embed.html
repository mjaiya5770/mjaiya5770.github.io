<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Honest Penny deals</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-rounded,'Arial Rounded MT Bold',system-ui,sans-serif;
  background:#FFF8F0;color:#4A3728;font-size:14px}
.ccw{border:2px solid #FF7B6B;border-radius:22px;overflow:hidden;background:#FFF8F0;max-width:340px}
.ccw-head{display:flex;align-items:center;gap:10px;padding:12px 14px;
  background:linear-gradient(135deg,#FFE3D6,#FFF8F0)}
.ccw-head img{border-radius:10px}
.ccw-head b{font-size:15px}
.ccw-head small{color:#8A6A55;font-size:11px}
.ccw-list{padding:10px 12px}
.ccw-deal{background:#fff;border:2px solid #F7DCC9;border-radius:16px;padding:10px 12px;margin-bottom:8px}
.ccw-deal .t{font-weight:800;font-size:13px;line-height:1.35}
.ccw-deal .m{font-size:11px;color:#8A6A55;margin-top:3px}
.ccw-deal a{display:inline-block;margin-top:8px;background:#FF7B6B;color:#4A3728;
  font-weight:800;font-size:12px;padding:7px 14px;border-radius:999px;text-decoration:none}
.ccw-foot{text-align:center;padding:8px;font-size:11px;color:#8A6A55}
.ccw-foot a{color:#E85D4C;font-weight:800;text-decoration:none}
</style>
</head>
<body>
<div class="ccw">
  <div class="ccw-head">
    <img src="https://honest-penny.vercel.app/assets/icon.webp" alt="Penny" width="36" height="36">
    <div><b id="ccw-title">Today's deals</b><br><small>Verified daily by Honest Penny</small></div>
  </div>
  <div class="ccw-list" id="ccw-list"><p style="padding:12px;color:#8A6A55">Penny is sniffing out deals&hellip;</p></div>
  <div class="ccw-foot">Powered by <a href="https://honest-penny.vercel.app/" target="_blank" rel="noopener">&#128055; Honest Penny</a></div>
</div>
<script>
(function(){
  "use strict";
  var SITE = "https://honest-penny.vercel.app";
  var STORES = [{"slug": "nike", "name": "Nike", "category": "fashion"}, {"slug": "adidas", "name": "Adidas", "category": "fashion"}, {"slug": "shein", "name": "Shein", "category": "fashion"}, {"slug": "sephora", "name": "Sephora", "category": "beauty"}, {"slug": "ulta", "name": "Ulta Beauty", "category": "beauty"}, {"slug": "doordash", "name": "DoorDash", "category": "food-delivery"}, {"slug": "uber-eats", "name": "Uber Eats", "category": "food-delivery"}, {"slug": "dominos", "name": "Domino's", "category": "food-delivery"}, {"slug": "best-buy", "name": "Best Buy", "category": "electronics"}, {"slug": "ebay", "name": "eBay", "category": "electronics"}, {"slug": "target", "name": "Target", "category": "general"}, {"slug": "walmart", "name": "Walmart", "category": "general"}, {"slug": "temu", "name": "Temu", "category": "general"}, {"slug": "macys", "name": "Macy's", "category": "department-stores"}, {"slug": "kohls", "name": "Kohl's", "category": "department-stores"}, {"slug": "chewy", "name": "Chewy", "category": "pets"}, {"slug": "wayfair", "name": "Wayfair", "category": "home-garden"}, {"slug": "home-depot", "name": "The Home Depot", "category": "home-garden"}, {"slug": "lowes", "name": "Lowe's", "category": "home-garden"}, {"slug": "ikea", "name": "IKEA", "category": "home-garden"}, {"slug": "autozone", "name": "AutoZone", "category": "auto"}, {"slug": "tire-rack", "name": "Tire Rack", "category": "auto"}, {"slug": "ashley-furniture", "name": "Ashley Furniture", "category": "home-garden"}, {"slug": "pottery-barn", "name": "Pottery Barn", "category": "home-garden"}, {"slug": "levis", "name": "Levi's", "category": "fashion"}, {"slug": "jcpenney", "name": "JCPenney", "category": "department-stores"}, {"slug": "bath-body-works", "name": "Bath & Body Works", "category": "beauty"}, {"slug": "old-navy", "name": "Old Navy", "category": "fashion"}, {"slug": "nordstrom-rack", "name": "Nordstrom Rack", "category": "fashion"}, {"slug": "cvs", "name": "CVS", "category": "health-pharmacy"}, {"slug": "walgreens", "name": "Walgreens", "category": "health-pharmacy"}, {"slug": "sally-beauty", "name": "Sally Beauty", "category": "beauty"}, {"slug": "dermstore", "name": "Dermstore", "category": "beauty"}, {"slug": "petsmart", "name": "PetSmart", "category": "pets"}, {"slug": "petco", "name": "Petco", "category": "pets"}, {"slug": "dell", "name": "Dell", "category": "electronics"}, {"slug": "newegg", "name": "Newegg", "category": "electronics"}, {"slug": "bh-photo", "name": "B&H Photo Video", "category": "electronics"}, {"slug": "staples", "name": "Staples", "category": "office"}, {"slug": "dicks-sporting-goods", "name": "Dick's Sporting Goods", "category": "sports-outdoors"}, {"slug": "pizza-hut", "name": "Pizza Hut", "category": "food-delivery"}, {"slug": "hellofresh", "name": "HelloFresh", "category": "food-delivery"}, {"slug": "expedia", "name": "Expedia", "category": "travel"}, {"slug": "grubhub", "name": "Grubhub", "category": "food-delivery"}, {"slug": "groupon", "name": "Groupon", "category": "general"}, {"slug": "foot-locker", "name": "Foot Locker", "category": "fashion"}, {"slug": "finish-line", "name": "Finish Line", "category": "fashion"}, {"slug": "dsw", "name": "DSW", "category": "fashion"}, {"slug": "zara", "name": "Zara", "category": "fashion"}, {"slug": "asos", "name": "ASOS", "category": "fashion"}, {"slug": "athleta", "name": "Athleta", "category": "fashion"}, {"slug": "uniqlo", "name": "Uniqlo", "category": "fashion"}, {"slug": "pacsun", "name": "PacSun", "category": "fashion"}, {"slug": "american-eagle", "name": "American Eagle", "category": "fashion"}, {"slug": "famous-footwear", "name": "Famous Footwear", "category": "fashion"}, {"slug": "zappos", "name": "Zappos", "category": "fashion"}, {"slug": "banana-republic", "name": "Banana Republic", "category": "fashion"}, {"slug": "loft", "name": "LOFT", "category": "fashion"}, {"slug": "hollister", "name": "Hollister", "category": "fashion"}, {"slug": "under-armour", "name": "Under Armour", "category": "fashion"}, {"slug": "steve-madden", "name": "Steve Madden", "category": "fashion"}, {"slug": "rack-room-shoes", "name": "Rack Room Shoes", "category": "fashion"}, {"slug": "shoe-carnival", "name": "Shoe Carnival", "category": "fashion"}, {"slug": "converse", "name": "Converse", "category": "fashion"}, {"slug": "skechers", "name": "Skechers", "category": "fashion"}, {"slug": "ugg", "name": "UGG", "category": "fashion"}, {"slug": "birkenstock", "name": "Birkenstock", "category": "fashion"}, {"slug": "timberland", "name": "Timberland", "category": "fashion"}, {"slug": "heydude", "name": "HEYDUDE", "category": "fashion"}, {"slug": "overstock", "name": "Overstock", "category": "home-garden"}, {"slug": "dyson", "name": "Dyson", "category": "home-garden"}, {"slug": "fenty-beauty", "name": "Fenty Beauty", "category": "beauty"}, {"slug": "samsung", "name": "Samsung", "category": "electronics"}, {"slug": "lenovo", "name": "Lenovo", "category": "electronics"}, {"slug": "hp", "name": "HP", "category": "electronics"}, {"slug": "apple", "name": "Apple", "category": "electronics"}, {"slug": "academy-sports", "name": "Academy Sports + Outdoors", "category": "sports-outdoors"}, {"slug": "bass-pro-shops", "name": "Bass Pro Shops", "category": "sports-outdoors"}, {"slug": "carters", "name": "Carter's", "category": "kids-baby"}, {"slug": "childrens-place", "name": "The Children's Place", "category": "kids-baby"}, {"slug": "sierra", "name": "Sierra", "category": "fashion"}];
  var params = new URLSearchParams(location.search);
  var store = params.get("store") || "";
  var cat = params.get("category") || "";
  var bySlug = {};
  STORES.forEach(function(s){ bySlug[s.slug] = s; });
  fetch(SITE + "/data/coupons.json", {cache:"no-store"}).then(function(r){return r.json();})
    .then(function(data){
      var coupons = (data.coupons || data).filter(function(c){
        if (store) return c.store_slug === store;
        if (cat) {
          var st = null;
          for (var i = 0; i < STORES.length; i++) if (STORES[i].slug === c.store_slug) st = STORES[i];
          return st && st.category === cat;
        }
        return true;
      });
      coupons.sort(function(a,b){
        var fa = a.featured ? 0 : 1, fb = b.featured ? 0 : 1;
        if (fa !== fb) return fa - fb;
        return (b.verified_date || "").localeCompare(a.verified_date || "");
      });
      var top = coupons.slice(0, 5);
      var title = store && bySlug[store] ? bySlug[store].name + " deals" : (cat ? cat + " deals" : "Today's deals");
      document.getElementById("ccw-title").textContent = title;
      var list = document.getElementById("ccw-list");
      if (!top.length) {
        list.innerHTML = "<p style='padding:12px;color:#8A6A55'>No deals right now \u2014 check back soon!</p>";
        return;
      }
      list.innerHTML = "";
      top.forEach(function(c){
        var d = document.createElement("div");
        d.className = "ccw-deal";
        var meta = [];
        if (c.verified_date) meta.push("Verified " + c.verified_date);
        var t = document.createElement("div"); t.className = "t"; t.textContent = c.title || "Deal";
        var m = document.createElement("div"); m.className = "m"; m.textContent = meta.join(" \u00b7 ");
        var a = document.createElement("a");
        a.href = SITE + "/go/" + c.id + "/";
        a.target = "_blank"; a.rel = "nofollow sponsored noopener";
        a.textContent = c.code ? "Reveal code" : "Get deal";
        d.appendChild(t); d.appendChild(m); d.appendChild(a);
        list.appendChild(d);
      });
    }).catch(function(){
      document.getElementById("ccw-list").innerHTML =
        "<p style='padding:12px;color:#8A6A55'>Penny tripped over the wifi. Try again soon!</p>";
    });
})();
</script>
</body>
</html>
